services:
  # 1. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: zerotoken-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # 2. ZeroToken FastAPI Gateway
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerotoken-gateway
    ports:
      - "8000:8000"
    volumes:
      # Mount SQLite database file so tenant API keys and metrics persist on host & container
      - ./zerotoken_metrics.db:/app/zerotoken_metrics.db
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # 3. Streamlit Observability Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerotoken-dashboard
    command: ["uv", "run", "streamlit", "run", "app/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      # Mount SQLite database so dashboard reads live metrics updated by gateway
      - ./zerotoken_metrics.db:/app/zerotoken_metrics.db
    env_file:
      - .env
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  qdrant_data: